<!doctype html>

<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Prism</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link

      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"

      rel="stylesheet"

    />

    <link

      rel="stylesheet"

      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"

    />

    <link rel="stylesheet" href="./styles.css" />

  </head>

  <body>

    <main class="app state-intro mode-colors">

      <header class="panel-header" aria-label="Prism">

        <span id="dragHandle" class="drag-handle" aria-hidden="true" hidden>

          <span class="material-symbols-outlined">drag_indicator</span>

        </span>

        <div id="siteBrand" class="site-brand" hidden>
          <span id="siteBrandLogoWrap" class="site-brand-logo-wrap" hidden>
            <img id="siteBrandLogo" class="site-brand-logo" alt="" />
          </span>
          <span id="siteBrandTitle" class="site-brand-title"></span>
        </div>

        <button

          id="closeBtn"

          class="btn-close"

          type="button"

          aria-label="Close panel"

          title="Close"

          hidden

        >

          <span class="material-symbols-outlined" aria-hidden="true">close</span>

        </button>

      </header>

      <nav id="tabBar" class="tab-bar" data-active="colors" role="tablist" aria-label="Extraction mode">
        <div id="tabIndicator" class="tab-indicator" aria-hidden="true"></div>

        <button

          id="tabColors"

          class="tab is-active"

          type="button"

          role="tab"

          aria-selected="true"

          aria-controls="colorResults"

          data-mode="colors"

        >

          Colors

        </button>

        <button

          id="tabFonts"

          class="tab"

          type="button"

          role="tab"

          aria-selected="false"

          aria-controls="fontResults"

          data-mode="fonts"

        >

          Fonts

        </button>

        <button

          id="tabImages"

          class="tab"

          type="button"

          role="tab"

          aria-selected="false"

          aria-controls="imageResults"

          data-mode="images"

        >

          Images

        </button>

        <button

          id="tabIcons"

          class="tab"

          type="button"

          role="tab"

          aria-selected="false"

          aria-controls="iconResults"

          data-mode="icons"

        >

          Icons

        </button>

      </nav>

      <div class="panel-body">

        <div id="loading" class="loading" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <p id="loadingText" class="loading-text">Looking at colors on this page…</p>
        </div>



        <section id="intro" class="state-intro">

          <p id="introDesc" class="intro-desc">Extract the color palette used on this webpage</p>

          <div id="errorBanner" class="error-banner" hidden>

            <div class="error-banner-head">

              <span id="errorBannerIcon" class="material-symbols-outlined" aria-hidden="true">info</span>

              <p id="errorBannerTitle" class="error-banner-title"></p>

            </div>

            <p id="errorMessage" class="error-message"></p>

          </div>

        </section>



        <section id="colorResults" class="tab-panel state-results" hidden>

          <div class="results-toolbar">

            <div class="results-toolbar-leading">
              <p id="status" class="status"></p>
              <div id="pagePreviewToggleWrap" class="page-preview-toggle">
                <label class="page-preview-toggle-control" for="pagePreviewToggle">
                  <input id="pagePreviewToggle" type="checkbox" />
                  <span id="pagePreviewToggleLabel" class="page-preview-toggle-label"
                    >Changes stay in the palette</span
                  >
                </label>
                <span class="page-preview-info">
                  <button
                    id="pagePreviewInfoBtn"
                    class="page-preview-info-btn"
                    type="button"
                    aria-describedby="pagePreviewInfoTip"
                    aria-label="About preview on page"
                  >
                    <span class="material-symbols-outlined" aria-hidden="true">info</span>
                  </button>
                </span>
                <span id="pagePreviewInfoTip" class="page-preview-info-tip" role="tooltip">
                  See your palette color changes live on this webpage.
                </span>
              </div>
            </div>

            <div class="results-toolbar-actions">
              <div id="colorContentMenu" class="content-menu" data-active="palette">
                <button
                  id="colorContentMenuBtn"
                  class="content-menu-btn"
                  type="button"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-controls="colorContentMenuList"
                  title="Switch view"
                >
                  <span id="colorContentMenuIcon" class="material-symbols-outlined" aria-hidden="true">palette</span>
                  <span id="colorContentMenuLabel">Palette</span>
                  <span class="material-symbols-outlined content-menu-caret" aria-hidden="true">expand_more</span>
                </button>
                <div
                  id="colorContentMenuList"
                  class="content-menu-list"
                  role="listbox"
                  aria-label="Color results view"
                  hidden
                >
                  <button
                    type="button"
                    class="content-menu-option is-active"
                    role="option"
                    aria-selected="true"
                    data-content="palette"
                  >
                    <span class="material-symbols-outlined" aria-hidden="true">palette</span>
                    <span>Palette</span>
                  </button>
                  <button
                    type="button"
                    class="content-menu-option"
                    role="option"
                    aria-selected="false"
                    data-content="css"
                  >
                    <span class="material-symbols-outlined" aria-hidden="true">data_object</span>
                    <span>CSS</span>
                  </button>
                </div>
              </div>
            </div>

          </div>

          <div class="palette-stage">
            <div id="swatches" class="swatches" data-view="roles"></div>

            <div
              id="colorViewToggle"
              class="view-toggle view-toggle-float"
              data-active="roles"
              role="radiogroup"
              aria-label="Color palette layout"
            >
              <div class="view-toggle-indicator" aria-hidden="true"></div>
              <button
                type="button"
                class="view-toggle-btn is-active"
                role="radio"
                aria-checked="true"
                data-view="roles"
                title="Grid view"
                aria-label="Grid view"
              >
                <span class="material-symbols-outlined" aria-hidden="true">grid_view</span>
              </button>
              <button
                type="button"
                class="view-toggle-btn"
                role="radio"
                aria-checked="false"
                data-view="stack"
                title="Stack view"
                aria-label="Stack view"
              >
                <span class="material-symbols-outlined" aria-hidden="true">view_agenda</span>
              </button>
            </div>
          </div>

          <div id="cssExportPanel" class="css-export-panel" hidden>
            <pre id="cssExportCode" class="css-export-code" tabindex="0" aria-label="Palette CSS variables"></pre>
          </div>

        </section>



        <section id="fontResults" class="tab-panel state-results" hidden>

          <div id="fonts" class="fonts"></div>

        </section>

        <section id="imageResults" class="tab-panel state-results" hidden>

          <div id="images" class="assets-grid"></div>

        </section>

        <section id="iconResults" class="tab-panel state-results" hidden>

          <div id="icons" class="assets-grid"></div>

        </section>

      </div>



      <footer class="panel-footer">

        <button id="extractBtn" class="btn btn-primary btn-block" type="button">

          <span id="extractBtnIcon" class="material-symbols-outlined" aria-hidden="true">palette</span>

          <span id="extractBtnLabel">Extract color palette</span>

        </button>

        <div id="resultsFooter" class="footer-row">

          <button
            id="shuffleBtn"
            class="btn btn-secondary"
            type="button"
            aria-label="Shuffle color palette"
            title="Generate a new palette from this page"
          >
            <span class="material-symbols-outlined" aria-hidden="true">shuffle</span>
            <span>Shuffle colors</span>
          </button>

          <button id="copyBtn" class="btn btn-primary" type="button">

            <span id="copyBtnIcon" class="material-symbols-outlined" aria-hidden="true">content_copy</span>

            <span id="copyBtnLabel">Copy color palette to Figma</span>

          </button>

          <button
            id="clearSelectionBtn"
            class="btn btn-secondary"
            type="button"
            hidden
            aria-label="Unselect all"
            title="Unselect all"
          >
            <span class="material-symbols-outlined" aria-hidden="true">deselect</span>
            <span>Unselect all</span>
          </button>

          <button
            id="reloadBtn"
            class="btn btn-primary"
            type="button"
            hidden
            data-action="reload"
            aria-label="Reload"
            title="Reload"
          >
            <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
            <span id="reloadBtnLabel">Reload</span>
          </button>

        </div>

      </footer>

    </main>

    <script type="module" src="./App.js"></script>

  </body>

</html>
