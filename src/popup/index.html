<!doctype html>

<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Prism Palette</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link

      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"

      rel="stylesheet"

    />

    <link

      rel="stylesheet"

      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"

    />

    <link rel="stylesheet" href="./styles.css" />

  </head>

  <body>

    <main class="app state-intro mode-colors">

      <header class="panel-header">

        <h1>Prism Palette</h1>

        <button

          id="closeBtn"

          class="btn-close"

          type="button"

          aria-label="Close panel"

          title="Close"

          hidden

        >

          <span class="material-symbols-outlined" aria-hidden="true">close</span>

        </button>

      </header>



      <nav id="tabBar" class="tab-bar" data-active="colors" role="tablist" aria-label="Extraction mode">
        <div id="tabIndicator" class="tab-indicator" aria-hidden="true"></div>

        <button

          id="tabColors"

          class="tab is-active"

          type="button"

          role="tab"

          aria-selected="true"

          aria-controls="colorResults"

          data-mode="colors"

        >

          Color palette

        </button>

        <button

          id="tabFonts"

          class="tab"

          type="button"

          role="tab"

          aria-selected="false"

          aria-controls="fontResults"

          data-mode="fonts"

        >

          Font families

        </button>

      </nav>



      <div class="panel-body">

        <div id="loading" class="loading" hidden>

          <div class="spinner" aria-hidden="true"></div>

          <p id="loadingText" class="loading-text">Analyzing colors across the page…</p>

        </div>



        <section id="intro" class="state-intro">

          <p id="introDesc" class="intro-desc">Extract the color palette used on this webpage</p>

          <div id="errorBanner" class="error-banner" hidden>

            <div class="error-banner-head">

              <span id="errorBannerIcon" class="material-symbols-outlined" aria-hidden="true">info</span>

              <p id="errorBannerTitle" class="error-banner-title"></p>

            </div>

            <p id="errorMessage" class="error-message"></p>

          </div>

        </section>



        <section id="colorResults" class="tab-panel state-results" hidden>

          <p id="status" class="status"></p>

          <div id="swatches" class="swatches"></div>

        </section>



        <section id="fontResults" class="tab-panel state-results" hidden>

          <div id="fonts" class="fonts"></div>

        </section>

      </div>



      <footer class="panel-footer">

        <button id="extractBtn" class="btn btn-primary btn-block" type="button">

          <span id="extractBtnIcon" class="material-symbols-outlined" aria-hidden="true">palette</span>

          <span id="extractBtnLabel">Extract color palette</span>

        </button>

        <div id="resultsFooter" class="footer-row">

          <button id="resetBtn" class="btn btn-secondary" type="button">

            <span class="material-symbols-outlined" aria-hidden="true">restart_alt</span>

            <span>Reset</span>

          </button>

          <button id="copyBtn" class="btn btn-primary" type="button">

            <span id="copyBtnIcon" class="material-symbols-outlined" aria-hidden="true">content_copy</span>

            <span id="copyBtnLabel">Copy palette</span>

          </button>

        </div>

      </footer>

    </main>

    <script type="module" src="./App.js"></script>

  </body>

</html>
