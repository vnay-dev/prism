<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism color picker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="color-picker-frame">
    <div id="colorPickerCard" class="color-picker-card">
      <div class="color-picker-card-bar">
        <h2 class="color-picker-card-title">Color picker</h2>
        <button
          type="button"
          id="colorPickerClose"
          class="cp-close"
          title="Close"
          aria-label="Close color picker"
        >
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
      </div>
      <div id="colorPickerMount" class="color-picker-frame-mount"></div>
    </div>
    <script type="module" src="./colorPickerFrame.js"></script>
  </body>
</html>
